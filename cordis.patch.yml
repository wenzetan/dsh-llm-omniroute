# dsh-dsh-llm-omniroute bundle patch
#
# One entry: `insert` mounts the plugin row. The host half registers the
# `omniroute` provider route on ctx.llm (display name "Custom Provider") and,
# when the composition has a web seam, the `omniroute` search and fetch
# providers. The route only answers once a base URL and a key are configured —
# see README「配置」.
#
# The row id below IS the settings namespace the settings page writes
# (`dsh-llm-omniroute`), so it must stay in sync with src/index.ts.
#
# Why the web seam is not pinned here: `web` is an official core row, and a
# bundle patch must not override core rows. Pin it in the profile's own
# cordis.patch.yml instead — without the pin, ctx.web sees two usable search
# providers (the shipped `deepseek-official` one and this gateway's) and
# answers WEB_PROVIDER_AMBIGUOUS:
#
#   - id: web
#     config:
#       searchProvider: omniroute
#       fetchProvider: omniroute

- insert:
    - id: dsh-llm-omniroute
      name: dsh-dsh-llm-omniroute
