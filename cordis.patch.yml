# dsh-omniroute bundle patch
#
# Two entries, both safe to compose anywhere:
#
# 1. `insert` mounts the plugin row. The host half registers the `omniroute`
#    provider route on ctx.llm (display name "Custom Provider") and, when the
#    composition has a web seam, the `omniroute` search and fetch providers.
#    The route only answers once a base URL and a key are configured — see
#    README「配置」.
#
# 2. The `web` override pins ctx.web at the gateway's own retrieval stack
#    (`POST {baseURL}/search`, `POST {baseURL}/web/fetch`) instead of the
#    shipped `deepseek-official` search provider (Anthropic Messages, needs a
#    DeepSeek credential) and the local anonymous fetcher. Without the pin, two
#    usable search providers make the seam answer WEB_PROVIDER_AMBIGUOUS.
#    In a composition with no `web` row the loader warns "entry not found" and
#    skips the entry — the chat route is unaffected.
#
# The row id below IS the settings namespace the settings page writes
# (`llm-omniroute`), so it must stay in sync with src/index.ts.

- insert:
    - id: llm-omniroute
      name: dsh-omniroute

- id: web
  config:
    searchProvider: omniroute
    fetchProvider: omniroute
